<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AUDIT 卡密生成器</title>

<!-- 导入思源黑体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #2a2a3e;
    --purple: #a855f7;
    --pink: #ec4899;
    --text: #e0e0e0;
}

/* 亮色模式 */
.light-mode {
    --bg: #f4f4fb;
    --card: #ffffff;
    --border: #ddd;
    --purple: #7c3aed;
    --pink: #db2777;
    --text: #222;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    transition: background 0.3s, color 0.3s;
}

.container {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 2rem 1.5rem; /* 调整内边距 */
    border: 1px solid var(--border);
    position: relative;
}

/* 主题切换 */
.theme-toggle {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--text);
}

/* 大标题样式 */
.header {
    text-align: center;
    margin-bottom: 2rem;
}
.header h1 {
    font-size: 1.8rem; /* 加大标题 */
    font-weight: 900; /* 思源黑体特粗 */
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.input-group {
    margin-bottom: 1.2rem;
}
.input-group input {
    width: 100%;
    padding: 0.9rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 1rem;
    font-family: 'Noto Sans SC', sans-serif;
}
.input-group input:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
}

.btn {
    width: 100%;
    padding: 0.95rem;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: transform 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
}
.btn:hover { transform: translateY(-2px); }

/* 结果区域 */
.result-box {
    margin-top: 1.5rem;
    padding: 1.2rem;
    border-radius: 10px;
    background: rgba(0,0,0,0.2);
    border-left: 4px solid var(--purple);
    display: none;
}
.result-box.show { display: block; }

.result-key {
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    word-break: break-all;
    color: var(--text);
}

.copy-btn {
    margin-top: 1rem;
    padding: 0.7rem;
    font-size: 0.9rem;
    background: rgba(255,255,255,0.1);
}

.toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--purple);
    color: #fff;
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
    font-family: 'Noto Sans SC', sans-serif;
}
.toast.show { display: block; }

.error {
    color: #ff6b6b;
    font-size: 0.85rem;
    margin-top: 0.8rem;
    text-align: center;
    display: none;
}
.error.show { display: block; }
</style>
</head>

<body>
<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>

    <div class="header">
        <h1>AUDIT KEYGEN</h1>
    </div>

    <div class="input-group">
        <input id="dateInput" type="tel" placeholder="请输入日期（纯数字）">
        <div class="error" id="error">❌ 日期必须为纯数字</div>
    </div>

    <button class="btn" onclick="generateKey()">生成卡密</button>

    <div class="result-box" id="resultBox">
        <div class="result-key" id="resultKey"></div>
        <button class="btn copy-btn" onclick="copyKey()">📋 复制卡密</button>
    </div>
</div>

<div class="toast" id="toast">✅ 已复制</div>

<script>
let currentKey = "";

function generateKey() {
    const date = document.getElementById("dateInput").value.trim();
    const error = document.getElementById("error");
    const box = document.getElementById("resultBox");

    error.classList.remove("show");
    box.classList.remove("show");

    if (!/^\d+$/.test(date)) {
        error.classList.add("show");
        return;
    }

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let rand = "";
    for (let i = 0; i < 8; i++)
        rand += chars[Math.floor(Math.random() * chars.length)];

    currentKey = `AUDIT_${date}_${rand}`;
    document.getElementById("resultKey").innerText = currentKey;
    box.classList.add("show");
}

function copyKey() {
    if (!currentKey) return;
    navigator.clipboard.writeText(currentKey).then(() => {
        showToast();
        if (navigator.vibrate) navigator.vibrate(50);
    });
}

function showToast() {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1200);
}

/* 主题切换 */
function toggleTheme() {
    document.body.classList.toggle("light-mode");
    document.getElementById("themeBtn").innerText =
        document.body.classList.contains("light-mode") ? "🌙" : "☀️";
}

if (window.matchMedia("(prefers-color-scheme: light)").matches) {
    document.body.classList.add("light-mode");
    document.getElementById("themeBtn").innerText = "🌙";
}
</script>
</body>
</html>
