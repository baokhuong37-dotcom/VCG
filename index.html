<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AUDIT 卡密生成器</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #2a2a3e;
    --purple: #a855f7;
    --pink: #ec4899;
    --text: #e0e0e0;
}

.light-mode {
    --bg: #f4f4fb;
    --card: #ffffff;
    --border: #ddd;
    --purple: #7c3aed;
    --pink: #db2777;
    --text: #222;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    transition: background 0.3s, color 0.3s;
}

.container {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 2rem 1.5rem;
    border: 1px solid var(--border);
    position: relative;
}

.theme-toggle {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--text);
}

.header {
    text-align: center;
    margin-bottom: 2rem;
}
.header h1 {
    font-size: 1.8rem;
    font-weight: 500;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.input-group {
    margin-bottom: 1.2rem;
}
.input-group label {
    display: block;
    margin-bottom: 0.4rem;
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--text);
    opacity: 0.8;
}
.input-group input {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 1rem;
    font-weight: 300;
    font-family: 'Noto Sans SC', sans-serif;
}
.input-group input:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
}

.btn {
    width: 100%;
    padding: 0.9rem;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    color: #fff;
    font-weight: 400;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: transform 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
}
.btn:hover { transform: translateY(-2px); }

.result-box {
    margin-top: 1.5rem;
    padding: 1.2rem;
    border-radius: 10px;
    background: rgba(0,0,0,0.2);
    border-left: 4px solid var(--purple);
    display: none;
}
.result-box.show { display: block; }

.result-key {
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    word-break: break-all;
    color: var(--text);
    font-weight: 400;
    user-select: all;
}

.copy-btn {
    margin-top: 1rem;
    padding: 0.7rem;
    font-size: 0.9rem;
    background: rgba(255,255,255,0.1);
    font-weight: 300;
}

.toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--purple);
    color: #fff;
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    z-index: 999;
}
.toast.show { display: block; }
.toast.error { background: #ff4757; }

.error {
    color: #ff6b6b;
    font-size: 0.8rem;
    margin-top: 0.6rem;
    text-align: center;
    display: none;
    font-weight: 300;
}
.error.show { display: block; }
</style>
</head>

<body>
<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>

    <div class="header">
        <h1>AUDIT KEYGEN</h1>
    </div>

    <div class="input-group">
        <label>审核员编号（选填）</label>
        <input id="auditorInput" type="text" placeholder="留空则不显示审核员编号">
    </div>

    <div class="input-group">
        <label>日期（8位数字）</label>
        <input id="dateInput" type="tel" placeholder="例如：20260101" maxlength="8">
        <div class="error" id="error">❌ 日期必须为8位纯数字</div>
    </div>

    <button class="btn" onclick="generateKey()">生成卡密</button>

    <div class="result-box" id="resultBox">
        <div class="result-key" id="resultKey"></div>
        <button class="btn copy-btn" onclick="copyKey()">📋 复制卡密</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentKey = "";

function generateKey() {
    const auditor = document.getElementById("auditorInput").value.trim();
    const date = document.getElementById("dateInput").value.trim();
    const error = document.getElementById("error");
    const box = document.getElementById("resultBox");

    error.classList.remove("show");
    box.classList.remove("show");

    // 只校验日期
    if (!/^\d{8}$/.test(date)) {
        error.innerText = "❌ 日期必须为8位纯数字";
        error.classList.add("show");
        return;
    }

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let rand = "";
    for (let i = 0; i < 8; i++) {
        rand += chars[Math.floor(Math.random() * chars.length)];
    }

    // 核心逻辑：根据审核员是否为空决定格式
    if (auditor === "") {
        currentKey = `AUDIT_${date}_${rand}`; // 无审核员格式
    } else {
        currentKey = `AUDIT${auditor}_${date}_${rand}`; // 有审核员格式
    }
    
    document.getElementById("resultKey").innerText = currentKey;
    box.classList.add("show");
}

function copyKey() {
    if (!currentKey) {
        showToast("❌ 没有可复制的内容", true);
        return;
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentKey).then(
            () => showToast("✅ 已复制到剪贴板"),
            () => fallbackCopy()
        );
    } else {
        fallbackCopy();
    }
}

function fallbackCopy() {
    const textArea = document.createElement("textarea");
    textArea.value = currentKey;
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            showToast("✅ 已复制到剪贴板");
            if (navigator.vibrate) navigator.vibrate(50);
        } else {
            throw new Error('execCommand failed');
        }
    } catch (err) {
        showToast("❌ 复制失败，请手动长按选择", true);
    }
    document.body.removeChild(textArea);
}

function showToast(message, isError = false) {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.className = "toast";
    if (isError) toast.classList.add("error");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
}

function toggleTheme() {
    document.body.classList.toggle("light-mode");
    document.getElementById("themeBtn").innerText =
        document.body.classList.contains("light-mode") ? "🌙" : "☀️";
}

if (window.matchMedia("(prefers-color-scheme: light)").matches) {
    document.body.classList.add("light-mode");
    document.getElementById("themeBtn").innerText = "🌙";
}
</script>
</body>
</html>
